# g2-studio render L4: realtime scheduling for vrserver's tracking threads.
#
# vrcompositor-launcher ships with cap_sys_nice=eip but vrserver has no
# capability, so the tracking driver's setschedparam(SCHED_FIFO, 15) calls fail
# EPERM and the 1 kHz pose-push threads run SCHED_OTHER under desktop noise
# (the EPERM lines are visible in vrserver.txt). core/steamvr.py re-applies a
# setcap on each launch, but that needs a scoped sudoers line and Steam updates
# wipe the cap. This PAM limit is the update-proof alternative: it raises
# RLIMIT_RTPRIO for the login user, letting any of the user's processes request
# SCHED_FIFO priority <= 20 without CAP_SYS_NICE (vrserver asks for 15).
#
# Installed (with the user name templated to yours) by:
#
#   sudo scripts/setup-system.sh
#
# then log out and back in once so the PAM session picks it up. Verify on the
# next VR session: the setschedparam EPERM lines vanish from vrserver.txt.
mrwhite0racle  -  rtprio  20
