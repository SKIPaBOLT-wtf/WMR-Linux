name: Publish reviewed source snapshot
on:
  push:
    branches: [publish-reviewed-snapshot]
    paths: [.github/workflows/publish-reviewed.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'SKIPaBOLT-wtf/WMR-Linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify reviewed bundle and fast-forward the continuation
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_BLOB: 6c2b801595807aabb0731a2a5c4b3666500f3906
          BUNDLE_SHA256: eba16ab681548fc7473fb0e26a9b789295329375c1d0b40f4d820cea12210db4
          TARGET_COMMIT: 7bd198ca4a9049c3be26a7ac59d63cbed6c3183b
          EXPECTED_BASE: d92aa7f1877ae8f77aff81e476dd90e881e652b2
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/reviewed.bundle"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$BUNDLE_BLOB" --jq .content | base64 --decode > "$bundle"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$bundle" | sha256sum --check -
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/g2-stability
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_COMMIT"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$TARGET_COMMIT"
          current=$(git ls-remote origin refs/heads/g2-stability | cut -f1)
          test "$current" = "$EXPECTED_BASE"
          git push origin "$TARGET_COMMIT:refs/heads/g2-stability"
